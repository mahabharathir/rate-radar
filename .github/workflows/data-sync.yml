name: Scheduled Official Data Sync

on:
  schedule:
    # Run daily at 06:30 AM IST (01:00 UTC) to fetch new daily fuel and exchange rates
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Official Data Ingestion Script
        run: |
          node scripts/update-data.js

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): sync official rates data [skip ci]"
            git push
          fi
